# Cloudflare Worker (Workers Builds) config for The Crux — marketing site + CRM SaaS.
# Deploys via `npx wrangler deploy` after `npm run build`.
name = "thecruxco"
main = "./dist/_worker.js/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serve Astro's static output; the worker handles /app and /api.
[assets]
directory = "./dist"
binding = "ASSETS"

# D1 relational database (bound automatically on deploy).
[[d1_databases]]
binding = "DB"
database_name = "thecrux-crm"
database_id = "494a3f9a-76c2-4573-ae24-905c98d234c8"

# R2 bucket for proposal attachments.
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "thecrux-attachments"

[vars]
APP_ENV = "production"
